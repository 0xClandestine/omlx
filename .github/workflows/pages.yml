# Build and deploy fork diff summary to GitHub Pages using protolambda/forkdiff.
# Runs on pushes to main and can be triggered manually.

name: "Fork Diff Pages"

permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream for diff
        run: |
          git remote add upstream https://github.com/jundot/omlx.git 2>/dev/null || true
          git fetch upstream --tags

      - name: Build forkdiff
        uses: "docker://protolambda/forkdiff:0.1.0"
        with:
          args: -repo=/github/workspace -fork=/github/workspace/fork.yaml -out=/github/workspace/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Move index.html to _site
        run: |
          mkdir -p _site
          mv index.html _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
